trigger:
  paths:
    include:
      - src/eai_delivery/*
      - examples/*
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - script: pip install -r requirements.txt
    displayName: Install dependencies

  - script: |
      export PYTHONPATH=src
      python -m eai_delivery.cli validate-contract         examples/customer_contract.yaml         --schema examples/deployment_contract.schema.json
    displayName: Validate Deployment Contract

  - script: |
      export PYTHONPATH=src
      python -m eai_delivery.cli release-gate         --reference-contract examples/reference_contract.yaml         --target-contract examples/customer_contract.yaml         --reference-profile examples/execution_profiles.yaml:reference         --target-profile examples/execution_profiles.yaml:customer         --golden examples/golden_cases.csv         --thresholds examples/thresholds.yaml         --human-reviews examples/human_reviews.csv         --out out         --evidence-bundle out/evidence_bundle.zip
    env:
      EVIDENCE_SIGNING_KEY: $(EVIDENCE_SIGNING_KEY)
    displayName: Enterprise AI Release Gate

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: out
      artifact: enterprise-ai-release-evidence
