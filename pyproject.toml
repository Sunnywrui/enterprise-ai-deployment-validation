[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-deployment-validation"
version = "0.3.0"
description = "Reference implementation for Enterprise AI Deployment Contract and Behavioral Equivalence."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.scripts]
eai-delivery = "eai_delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
